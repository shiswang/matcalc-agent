name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 引导测试用集群配置（clusters.json 不入库的既定红线）
        run: cp clusters.example.json clusters.json

      - name: 全量回归（163+ 测试，含 registry 49 工具契约锁）
        run: pytest tests/ -q --basetemp=.pytest_tmp_ci
